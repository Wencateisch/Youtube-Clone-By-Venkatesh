name: Build & Deploy Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'index.html'
      - 'index.css'
      - 'config.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp index.js www/
          cp index.css www/
          cp config.json www/
          cp manifest.webmanifest www/
          cp sw.js www/
          cp icon.svg www/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish debug APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="v$(node -p "require('./package.json').version")-$(date +%Y%m%d%H%M%S)"
          FILE="YouTubeClone-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$FILE"

          gh release create "$VERSION" "$FILE" \
            --title "YouTube Clone $VERSION (Debug)" \
            --notes "Built from main branch"

          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"