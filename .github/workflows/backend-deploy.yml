name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the server) needs Node 22.5 or newer.
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Test server
        run: |
          npm start &
          sleep 5
          curl -f http://localhost:8080/api/config
          curl -f http://localhost:8080/api/feed/home

  deploy-railway:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE_ID != ''
        uses: nickyout/railway-deploy@v3
        with:
          railway_service_id: ${{ env.RAILWAY_SERVICE_ID }}
          railway_token: ${{ env.RAILWAY_TOKEN }}