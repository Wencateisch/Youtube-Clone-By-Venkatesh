name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the server) needs Node 22.5 or newer.
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Test server
        run: |
          npm start &
          sleep 5
          curl -f http://localhost:8080/api/config
          curl -f http://localhost:8080/api/feed/home

  deploy-railway:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Railway credentials
        id: check
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_SERVICE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN / RAILWAY_SERVICE_ID are not set; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy to Railway
        if: steps.check.outputs.configured == 'true'
        run: |
          npm install -g @railway/cli
          railway up --service "$RAILWAY_SERVICE_ID" --detach
        working-directory: server