name: Refresh Catalog

on:
  schedule:
    # Once a day, well away from the Pacific quota reset. Every run costs about
    # 400 units (1 for the chart, 100 per query), so keep it infrequent.
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-catalog.mjs'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the catalog
        run: node scripts/build-catalog.mjs
        env:
          # Falls back to config.json when the secret is absent.
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}

      - name: Commit the snapshot when it changed
        run: |
          if git diff --quiet -- catalog.json www/catalog.json; then
            echo "Catalog unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json www/catalog.json
          git commit -m "Refresh the offline catalog"
          git push
