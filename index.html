<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A responsive YouTube-style video explorer." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>YouTube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header id="navBar" class="nav-bar">
      <div class="nav-top">
        <div id="logo" class="nav-left">
          <button class="brand" type="button" onclick="HomeButton()" aria-label="Go to home">
            <span class="brand-mark" aria-hidden="true"><i class="fab fa-youtube"></i></span>
            <span class="brand-text" id="brand-text">YouTube</span>
          </button>
        </div>
        <div id="end" class="nav-right">
          <button class="icon-btn hide-mobile" type="button" id="google-login-btn" aria-label="Sign in with Google">
            <i class="fab fa-google" aria-hidden="true"></i>
          </button>
          <button class="icon-btn hide-mobile" type="button" id="updates-btn" aria-label="Check for updates">
            <i class="fas fa-download" aria-hidden="true"></i>
          </button>
          <button class="icon-btn hide-mobile" type="button" onclick="AllowCam()" aria-label="Use camera">
            <i class="fas fa-video" aria-hidden="true"></i>
          </button>
          <button class="icon-btn hide-mobile" type="button" aria-label="Notifications">
            <i class="fas fa-bell" aria-hidden="true"></i>
          </button>
          <button class="icon-btn" type="button" onclick="searchVideos()" aria-label="Search">
            <i class="fas fa-search" aria-hidden="true"></i>
          </button>
          <button class="icon-btn avatar" type="button" id="profile-btn" aria-label="Open local profile">
            <i class="fas fa-user-circle" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div id="center" class="nav-center">
        <form id="search" class="search" role="search" onsubmit="return false;">
          <input
            type="text"
            id="video"
            name="q"
            placeholder="Search YouTube"
            autocomplete="off"
            inputmode="search"
            enterkeyhint="search"
            aria-label="Search videos"
          />
          <button type="button" id="clear-search" class="clear-btn" aria-label="Clear search" hidden>
            <i class="fas fa-times-circle" aria-hidden="true"></i>
          </button>
          <button type="button" class="search-btn" onclick="searchVideos()" aria-label="Search">
            <i class="fas fa-search" aria-hidden="true"></i>
          </button>
        </form>
      </div>

      <div class="chips" id="chips" aria-label="Categories">
        <button class="chip active" type="button" data-q="artificial intelligence">All</button>
        <button class="chip" type="button" data-q="music">Music</button>
        <button class="chip" type="button" data-q="gaming">Gaming</button>
        <button class="chip" type="button" data-q="news">News</button>
        <button class="chip" type="button" data-q="live">Live</button>
        <button class="chip" type="button" data-q="coding">Coding</button>
        <button class="chip" type="button" data-q="movies">Movies</button>
        <button class="chip" type="button" data-q="sports">Sports</button>
      </div>
    </header>

    <main class="page">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="videodiv" class="video-grid" aria-label="Videos"></section>
    </main>

    <div id="player" class="player" hidden>
      <div class="player-stage">
        <div class="player-video-wrap">
          <div id="player-frame-holder" class="player-frame-holder">
            <iframe id="player-frame" class="player-frame" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
          <div id="audio-panel" class="audio-panel" hidden>
            <div id="audio-art" class="audio-art"><i class="fas fa-headphones" aria-hidden="true"></i></div>
            <div class="audio-copy">
                  <h2 id="audio-title" class="audio-title"></h2>
              <p id="audio-channel" class="audio-channel"></p>
            </div>
            <button id="audio-play" class="pill-btn" type="button" aria-label="Play or pause audio">
              <i class="fas fa-pause" aria-hidden="true"></i><span>Pause</span>
            </button>
          </div>
          <button id="player-collapse" class="player-collapse" type="button" aria-label="Close player">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <aside class="player-rail" aria-label="Up next">
        <div class="player-rail-head">
          <div class="player-rail-meta">
            <div id="player-title" class="player-title"></div>
            <div id="player-channel" class="player-channel"></div>
          </div>
          <button id="audio-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Audio mode">
            <i class="fas fa-headphones" aria-hidden="true"></i>
          </button>
          <button id="pip-toggle" class="icon-btn" type="button" aria-label="Picture in picture">
            <i class="fas fa-picture-in-picture" aria-hidden="true"></i>
          </button>
          <button id="mini-toggle" class="icon-btn" type="button" aria-label="Mini player">
            <i class="fas fa-window-minimize" aria-hidden="true"></i>
          </button>
          <button id="zoom-toggle" class="icon-btn" type="button" role="switch" aria-checked="false" aria-label="Zoom to fill">
            <i class="fas fa-expand" aria-hidden="true"></i>
          </button>
        </div>
        <div id="player-suggest" class="player-suggest"></div>
      </aside>
    </div>

    <div id="mini-player" class="mini-player" hidden>
      <div id="mini-slot" class="mini-slot"></div>
      <div class="mini-bar">
        <span id="mini-title" class="mini-title"></span>
        <button id="mini-play" class="icon-btn" type="button" aria-label="Pause">
          <i class="fas fa-pause" aria-hidden="true"></i>
        </button>
        <button id="mini-expand" class="icon-btn" type="button" aria-label="Expand player">
          <i class="fas fa-expand" aria-hidden="true"></i>
        </button>
        <button id="mini-close" class="icon-btn" type="button" aria-label="Close player">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div id="profile-panel" class="modal-backdrop" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Your profile">
        <div class="modal-head">
          <h2>Your profile</h2>
          <button id="profile-close" class="icon-btn" type="button" aria-label="Close profile">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>
        <p class="modal-note">Local profile stored on this device (not a Google account).</p>
        <label class="field-label" for="profile-name">Display name</label>
        <div class="field-row">
          <input id="profile-name" class="field-input" type="text" maxlength="32" placeholder="Your name" />
          <button id="profile-save" class="pill-btn" type="button">Save</button>
        </div>
        <div class="modal-section">
          <h3>Recent watches</h3>
          <div id="history-list" class="history-list"></div>
          <div class="modal-actions">
            <button id="history-clear" class="pill-btn" type="button">Clear history</button>
            <button id="feed-reset" class="pill-btn" type="button">Reset feed</button>
          </div>
        </div>
        <div class="modal-section">
          <h3>Links</h3>
          <p id="home-link-wrap" class="link-row">Home: <a id="home-link" href="#" target="_blank" rel="noopener"></a></p>
          <p id="updates-info" class="link-row">Check for the latest Android build from the download button.</p>
          <button id="updates-check" class="pill-btn" type="button">Check for updates</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="bn-item active" type="button" onclick="HomeButton()"><i class="fas fa-home"></i><span>Home</span></button>
      <button class="bn-item" type="button" onclick="focusSearch()"><i class="fas fa-compass"></i><span>Explore</span></button>
      <button class="bn-item" type="button" onclick="focusSearch()"><i class="fas fa-plus-square"></i><span>Create</span></button>
      <button class="bn-item" type="button" onclick="searchByChip('subscriptions trending')"><i class="fas fa-play-circle"></i><span>Subs</span></button>
      <button class="bn-item" type="button" id="library-btn"><i class="fas fa-photo-video"></i><span>Library</span></button>
    </nav>

    <script src="./index.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
